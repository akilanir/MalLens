paths:
  cache_dir: ".mallens_cache_aggObfLarge"
  cache_dir_decomp: "/srv/akila/mallens/.mallens_cache_decomp"
  jadx_binary: "jadx" # PLEASE CHANGE THE JADX BIN DIR HERE
  log_file: "global_logfiles/pipeline.log"
  apktool_binary: "apktool" #PLEASE CHANGE THE JADX BIN DIR HERE

ingest:
  timeout_seconds: 600            # kill Androguard child process after this
  max_memory_mb: 8192             # RLIMIT_AS in child (Linux only; 0 = unlimited)
  max_strings_per_class: 300
  max_string_length: 400
  include_library_nodes: false    # androidx/kotlin/etc. as graph nodes?

classify:
  # Never graph nodes; calls INTO these are recorded as api_calls per class.
  framework_prefixes:
    - "Landroid/"
    - "Ljava/"
    - "Ljavax/"
    - "Ldalvik/"
    - "Lorg/apache/http/"
    - "Lorg/json/"
    - "Lorg/xml/"
    - "Lorg/w3c/"
  # Embedded library code compiled into the dex. Excluded as nodes by
  # default (boilerplate removal), but call counts into them are kept.
  library_prefixes:
    - "Landroidx/"
    - "Landroid/support/"
    - "Lkotlin/"
    - "Lkotlinx/"
    - "Lcom/google/firebase/"
    - "Lcom/google/gson/"
    - "Lcom/google/protobuf/"
    - "Lokhttp3/"
    - "Lokio/"
    - "Lretrofit2/"
    - "Lcom/squareup/"
    - "Lio/reactivex/"
    - "Lorg/greenrobot/"
    - "Lcom/bumptech/glide/"
    - "Lcom/facebook/ads/"
    - "Lcom/unity3d/"
  bundled_ok_prefixes:
    - "Landroid/support/"
    - "Landroidx/"
    - "Lkotlin/"
    - "Lkotlinx/"
    - "Lj$/"
    - "Lorg/apache/"
    - "Ljavax/inject/"
    - "Ljavax/annotation/"
    - "Lorg/json/"
    - "Lorg/xmlpull/"
    - "Lorg/w3c/"
    - "Lorg/xml/"
    - "Lcom/google/"


logging:
  level: "INFO"
  androguard_level: "ERROR"       # androguard 4.x is extremely chatty

features:
  sensitive_api_csv: "data/sensitive_apis.csv"
  jadx_timeout_seconds: 900
  apktool_timeout_seconds: 900
  jadx_extra_args: ["--no-res", "--no-debug-info", "--threads-count", "4"]
  entropy_threshold: 4.5          # Shannon bits/char to count as "high entropy"
  min_string_len_for_entropy: 12
  spoof_bonus: 10.0

importance:
  scorer: "pagerank"        # naive | pagerank | propagation
  decay: 0.6                   # per-hop attenuation (propagation)
  iterations: 3                # max hops of influence (propagation)
  pagerank_alpha: 0.85
  mix_base: 0.5                # final = mix*base + (1-mix)*graph_score

clustering:
  max_seeds: 15 #30
  min_seed_score: 0.15   
  max_hops: 2
  token_budget_per_cluster: 10000
  tokens_per_loc: 9.0          # rough java-source token estimate
  tokens_per_bytecode_unit: 0.4  # fallback when jadx failed for a class

llm:
  base_url: "http://localhost:11434"
  api_key_env: "ollama"     
  model: "qwen3-coder:latest"   #"gpt-4o-mini-2024-07-18" #qwen3-coder:latest"   # "llama3.1:8b-instruct-fp16"
  temperature: 0.0
  max_output_tokens: 2000
  request_timeout: 180
  max_clusters: 20                       # analyze top-N clusters only
  min_cluster_importance: 0.0 #It was 0.25 earlier


report:
  t_malicious_conf: 0.7
  t_suspicious_conf: 0.5
  t_unseen_importance: 0.5
  min_evidence_classes: 2
  out_dir: "reports_aggObfLarge"


########## FACTSHEET IMPL ###########
factsheet:
  prompt_version: "fs_v1"        # bump on ANY prompt edit; keys the cache
  temperature: 0.0
  char_budget: 10000             # per LLM call; larger classes are chunked
  min_quote_len: 12
  xcheck_stage2: true

factpaths:
  max_hops: 4                    # path length cutoff (nodes)
  max_paths_per_cluster: 12
  alias_names: true              # C1..Cn instead of real class names (A/B flag)

adjudicate:
  prompt_version: "adj_v1"
  temperature: 0.0

apk_verdict:
  suspicious_cluster_threshold: 2   # >=N suspicious clusters -> APK suspicious

